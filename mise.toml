[tools]
uv = "0.13.9"
"aqua:astral-sh/ruff" = "0.17.6"
osv-scanner = "2.7.1"
betterleaks = "latest"
hk = "2"
jactionlint = "latest"
lychee = "latest"
node = "26"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
pkl = "latest"
rumdl = "latest"
typos = "latest"

[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["uv sync --locked", "hk install"]

[tasks.test]
description = "Тесты стека"
run = "uv run --locked python -m unittest discover -s tests"

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
